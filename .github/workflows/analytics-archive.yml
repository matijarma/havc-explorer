name: Archive analytics

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh permanent analytics archives
        env:
          HAVC_CRON_SECRET: ${{ secrets.HAVC_CRON_SECRET }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${HAVC_CRON_SECRET}" \
            https://havc.matijar.info/api/cron
